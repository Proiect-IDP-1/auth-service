networks:
  public_net:
    driver: overlay
  auth_db_net:
    driver: overlay
    internal: true

services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - auth_db_net
    deploy:
      placement:
        constraints: [node.role == worker]
  auth-service:
    image: auth-service:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - public_net
      - auth_db_net
    ports:
      - "3000:3000"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - auth_db_net
    deploy:
      placement:
        constraints: [node.role == manager]
